# Default server (untuk domain tidak dikenal)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Redirect HTTP ke HTTPS untuk domain spesifik
server {
    listen 80;
    listen [::]:80;
    server_name jasakode.com www.jasakode.com;

    return 301 https://$host$request_uri;
}


# Server block HTTPS untuk domain spesifik
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name jasakode.com www.jasakode.com;

    root /var/www/jasakode.com/html;
    index index.html index.htm;

    ssl_certificate /etc/nginx/ssl/jasakode.crt;
    ssl_certificate_key /etc/nginx/ssl/jasakode.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/jasakode.com.access.log;
    error_log /var/log/nginx/jasakode.com.error.log;

    location / {
        proxy http://127.0.0.1:3000;
    }
}


sudo systemctl reload nginx
